ACTS.fpIcs=i=>{const F=fpGet(),z=F.plan.zones[+i];deliverICS((z.bitkiler||[]).map(P).filter(Boolean).flatMap(plantEvents),"bahce-bolge-"+(+i+1))};
ACTS.fpToBed=i=>{const F=fpGet(),z=F.plan.zones[+i],cell=50;const W=z.w*F.W,H=z.h*F.H;const cols=Math.max(2,Math.min(24,Math.round(W*100/cell))),rows=Math.max(2,Math.min(30,Math.round(H*100/cell)));
  const ids=(z.bitkiler||[]).filter(id=>FAM[id]);const cells={};if(ids.length){const per=Math.max(1,Math.floor(cols/ids.length));for(let c=0;c<cols;c++){const id=ids[Math.min(ids.length-1,Math.floor(c/per))];for(let r=0;r<rows;r++){const [a,b]=spacingCm(P(id));const step=Math.max(1,Math.round(Math.max(a,b)/cell));if(r%step===0&&c%Math.max(1,Math.round(Math.min(a,b)/cell))===0)cells[r+","+c]=id}}}
  const PL=udGet("plan",{beds:[]});PL.beds.push({id:uid(),name:z.ad,cell,cols,rows,years:{[NOW.getFullYear()+(CM>=10?1:0)]:cells}});udSet("plan",PL);PS.bed=PL.beds.length-1;PS.year=NOW.getFullYear()+(CM>=10?1:0);
  toast("Parsel oluşturuldu; komşu ve ekim nöbeti kontrolleriyle düzenleyin");go("plan")};
function fpPrompt(F,revision){
  const c=climate();const plist=PLANTS.map(p=>{const s=suit(p).lv;return p.id+"="+p.n+(s===3?"★":s===0?"⛔":"")}).join("; ");
  const nm={up:"üst kenarı",right:"sağ kenarı",down:"alt kenarı",left:"sol kenarı"};
  const mk=(F.markers||[]).map(m=>`${MK[m.t][1]} (x=${m.x}, y=${m.y})`).join("; ")||"yok";
  return `Sen deneyimli bir peyzaj mimarı ve ziraat mühendisisin; Türkiye'de hobi ve ev bahçeleri planlıyorsun. Türkçe yaz.
${locPromptText()}
Ekteki fotoğraf planlanacak bahçenin ${F.north==="?"?"yönü bilinmeyen":"kuşbakışı"} görüntüsüdür. Görüntünün kapsadığı alan yaklaşık ${F.W} m (yatay) × ${F.H} m (dikey).
Kuzey yönü: ${F.north==="?"?"bilinmiyor; gölgelerin yönünden tahmin et ve tahmini belirt":"fotoğrafın "+nm[F.north]}.
Kullanıcının fotoğraf üzerine koyduğu işaretler (x,y 0-1 arası, sol üst köşe 0,0): ${mk}.
Hedefler: ${F.goals.join(", ")||"genel hobi bahçesi"}. Notlar: ${F.notes||"yok"}.
İlkeler: Türkiye kuzey yarımkürededir; güney tarafı en çok güneşi alır, bina ve ağaçların kuzey tarafı gölgede kalır. Uzun bitkileri ve ağaçları sebzeleri gölgelemeyecek şekilde kuzey/kuzeybatı tarafa yerleştir. Sebze ve ot bölgeleri günde 6-8 saat güneş alan ve su kaynağına yakın yerde olsun. Meyve ağacı aralıkları ölçeğe göre gerçekçi olsun (bodur 3-4 m, standart 5-8 m, ceviz 10+ m); temel ve borulara yakın büyük ağaç koyma. Kompost ulaşılabilir ama gözden uzak olsun. Mevcut bina, ağaç, yol ve sert zeminin üzerine ekim bölgesi koyma; bunları "mevcut" türüyle işaretleyebilirsin. İklime uymayan (⛔) bitkileri önerme; ★ olanları tercih et.
Bitki kimliklerini YALNIZCA bu listeden kullan (id=ad): ${plist}
${revision?`Önceki plan (JSON): ${JSON.stringify(F.plan)}\nKullanıcının değişiklik isteği: "${revision}". Planı bu isteğe göre güncelle; değişmeyen bölgeleri koru.`:""}
ÇIKTI: Yalnızca geçerli JSON yaz, açıklama veya kod bloğu ekleme. Şema:
{"analiz":"Fotoğrafta gördüklerin: mevcut ağaçlar, bina, gölge, yol, eğim, zemin (2-4 cümle)","gunes":"Güneş ve gölge değerlendirmesi (1-2 cümle)","zones":[{"ad":"kısa ad","tur":"sebze|meyve|asma|ot|cicek|oturma|cocuk|kompost|sera|yol|mevcut|cim","x":0.1,"y":0.1,"w":0.2,"h":0.2,"bitkiler":["id"],"cesitler":["isteğe bağlı çeşit adları"],"adet":"ör. 3 elma, 2 armut veya 12 domates","neden":"1-2 cümle","bakim":"1 cümle"}],"yapilacaklar":["uygulama sırasıyla 4-8 adım; mevsime göre ne zaman"],"uyarilar":["varsa"]}
Kurallar: x,y sol üst köşe; x,y,w,h 0 ile 1 arasında ve x+w ≤ 1, y+h ≤ 1; bölgeler birbiriyle çakışmasın; 4-10 bölge; fotoğrafın gerçek görünümüne uy.`;
}
function fpParse(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("json");const j=JSON.parse(t.slice(a,b+1));
  j.zones=(j.zones||[]).map(z=>{const cl=v=>Math.max(0,Math.min(1,+v||0));let x=cl(z.x),y=cl(z.y),w=cl(z.w),h=cl(z.h);if(x+w>1)w=1-x;if(y+h>1)h=1-y;return Object.assign({},z,{x,y,w:Math.max(.02,w),h:Math.max(.02,h),tur:ZT[z.tur]?z.tur:"sebze",bitkiler:(z.bitkiler||[]).filter(id=>P(id)),ad:String(z.ad||"Bölge").slice(0,40)})});return j}
async function fpCall(revision){

  const ok=PLANTS.filter(p=>p.d<=maxD&&(f.alan!=="balkon"||POT[p.id])&&!["findik","kivi","kestane","ceviz","antepfistigi"].includes(p.id)&&!(f.alan!=="buyuk"&&TREES.includes(p.sh)&&!["cane","berry"].includes(p.sh)))

  :`<div class="alert r" style="font-size:16px"><span class="ic">1️⃣</span><div><b>Şimdi yapın:</b><br>${esc(N.f)}</div></div>

  ${KP.length>1?`<div class="row" style="margin-top:12px"><button class="btn ghost" style="flex:1" data-act="kback">← Geri</button><button class="btn ghost" style="flex:1" data-act="kreset">Baştan</button></div>`:""}
  <p class="xs mut" style="margin-top:10px">İlaç kullanırken etiketteki doz ve bekleme süresine uyun. <a data-go="safety">Güvenlik</a></p>`};
ACTS.kgo=a=>{KP.push(a);render();scrollTo(0,0)};ACTS.kback=()=>{KP.pop();render()};ACTS.kreset=()=>{KP=["root"];render()};
AFTER.kurtar=()=>{const b=$("#kGo");if(!b)return;b.onclick=async()=>{const fs=[...($("#kF").files||[])].slice(0,3),o=$("#kOut");if(!fs.length){toast("Fotoğraf seçin");return}b.disabled=true;o.innerHTML=aiBox(`<span class="dots">İnceliyorum</span>`);
  const gid=$("#kG")&&$("#kG").value,g=G.plants.find(x=>x.id===gid),p=g&&P(g.pid);const path=KP.slice(1).map((x,i)=>KT[KP[i]].o.find(o=>o[0]===x)[1]).join(" → "),N=KT[KP[KP.length-1]];
  const imgs=[];for(const f of fs)imgs.push((await resizeImage(f,1280,.85)).blob);
  const q=`Sen deneyimli bir bitki koruma uzmanısın. Türkçe, sakin ve net yaz; panik yaratma. ${locPromptText()}\n${g?`Bitki: ${g.nick||g.name}${p?" ("+p.lat+")":""}, ${g.place}, dikimden ${daysSince(g.date)} gün. Son kayıtlar: ${(g.logs||[]).slice(-5).map(l=>LOGT[l.t][1]+" "+fmtD(l.d)).join("; ")}`:"Bitki belirtilmedi."}\nKullanıcının cevapları: ${path}. Ön değerlendirme: ${N.f}\nFotoğraflara bak ve ön değerlendirmeyi doğrula veya düzelt. Biçim:\n## 1️⃣ Şimdi yapın (tek cümle)\n## 🔍 Ne görüyorum\n## 🩺 Olası neden (en olasıdan başlayarak, emin değilsen söyle)\n## 📅 Önümüzdeki 7 gün\n## 🚫 Yapmayın\nİlaç önerirsen etken madde grubu ve 'etiketteki doz ve bekleme süresine uyun' uyarısı ver.`;
  try{const r=await CAP.sample(q,{images:imgs,modelTier:"complex",cache:false,onText:({text})=>{o.innerHTML=aiBox(md(text))}});o.innerHTML=aiBox(md(r.text)+ttsBtn(r.text))+(g?`<button class="btn ghost full" id="kSave">📝 Günlüğe kaydet</button>`:"");
    if(g)$("#kSave").onclick=()=>{g.logs.push({t:"sorun",d:new Date().toISOString(),txt:plainText(r.text).replace(/\s+/g," ").slice(0,400)});savePlant(g);toast("Günlüğe eklendi")}}catch(e){o.innerHTML=`<div class="alert a"><div>${aiErr(e)}</div></div>`}b.disabled=false}};

ACTS.gcheck=gidArg=>{const g=G.plants.find(x=>x.id===(gidArg||curView().a));if(!g)return;const p=P(g.pid);
  if(!CAP.sample){toast("Bu özellik için yapay zekâ asistanı gerekiyor");return}
  modal("📸 Haftalık kontrol: "+(g.nick||g.name),`<p class="sm">Her hafta <b>aynı açıdan</b> bütün bitkiyi ve bir yaprağı yakından çekin. Yapay zekâ önceki fotoğrafla karşılaştırıp sağlık puanı verir.</p><input type="file" id="wcF" accept="image/*" capture="environment"><div id="wcP"></div><button class="btn full" id="wcGo" style="margin-top:8px">🔍 Kontrol et</button><div id="wcO"></div>`,(w,close)=>{
    let img=null;w.querySelector("#wcF").onchange=async e=>{const f=e.target.files[0];if(!f)return;img=f;const r=await resizeImage(f,800,.8);w.querySelector("#wcP").innerHTML=`<img src="${r.dataURL}" style="width:100%;border-radius:12px;margin-top:8px;max-height:220px;object-fit:cover">`};
    w.querySelector("#wcGo").onclick=async()=>{if(!img){toast("Fotoğraf seçin");return}const b=w.querySelector("#wcGo"),o=w.querySelector("#wcO");b.disabled=true;o.innerHTML=aiBox(`<span class="dots">İnceliyorum</span>`);
      try{const cur=await resizeImage(img,1280,.85),imgs=[cur.blob];const prev=[...(g.logs||[])].reverse().find(l=>l.img);if(prev){try{imgs.unshift(await (await fetch(prev.img)).blob())}catch(e){}}
        const sc=(g.logs||[]).filter(l=>l.score!=null).slice(-3).map(l=>fmtD(l.d)+": "+l.score+"/10").join(", ");
        const q=`Sen deneyimli bir ziraat mühendisisin. Türkçe yaz. ${locPromptText()}\nBitki: ${g.nick||g.name}${p?" ("+p.n+", "+p.lat+")":""}${g.cesit?", çeşit "+g.cesit:""}, ${g.place}, dikimden ${daysSince(g.date)} gün.${prev&&imgs.length>1?` İlk fotoğraf önceki kayıt (${fmtD(prev.d)}), son fotoğraf bugün.`:" Tek fotoğraf: bugün."}${sc?" Önceki puanlar: "+sc+".":""}\nSADECE şu JSON'u döndür, başka metin yazma:\n{"skor":0-10 arası tam sayı (10=çok sağlıklı; fotoğraftan anlaşılmıyorsa null),"ozet":"tek cümle","degisim":"öncekine göre daha iyi/aynı/daha kötü/karşılaştırma yok","sorunlar":["en fazla 3 kısa madde; yoksa boş"],"yapilacak":["en fazla 3 kısa, somut iş"],"emin":"yüksek/orta/düşük"}`;
        const r=await CAP.sample(q,{images:imgs,modelTier:"complex",cache:false});let j=null;try{j=JSON.parse((r.text.match(/\{[\s\S]*\}/)||[""])[0])}catch(e){}
        if(!j){o.innerHTML=aiBox(md(r.text));b.disabled=false;return}
        const u=await storePhoto(img);const lg={t:"foto",d:new Date().toISOString(),img:u,score:j.skor==null?null:Math.max(0,Math.min(10,+j.skor)),txt:`Haftalık kontrol${j.skor!=null?" "+j.skor+"/10":""}: ${j.ozet||""}${(j.yapilacak||[]).length?" Yapılacak: "+j.yapilacak.join("; "):""}`};
        g.logs.push(lg);savePlant(g);
        o.innerHTML=`<div class="card" style="margin-top:8px"><div class="row"><div style="font-size:36px;font-weight:900;color:${lg.score>=7?"var(--g6)":lg.score>=4?"var(--amber)":"var(--warn)"}">${lg.score!=null?lg.score+"/10":"?"}</div><div style="flex:1" class="sm"><b>${esc(j.ozet||"")}</b><div class="xs mut">${esc(j.degisim||"")} · güven: ${esc(j.emin||"")}</div></div></div>
          ${(j.sorunlar||[]).length?`<p class="sm"><b>Dikkat:</b></p><ul class="clean">${j.sorunlar.map(s=>`<li class="sm">⚠️ ${esc(s)}</li>`).join("")}</ul>`:""}${(j.yapilacak||[]).length?`<p class="sm"><b>Yapılacaklar:</b></p><ul class="clean okl">${j.yapilacak.map(s=>`<li class="sm">${esc(s)}</li>`).join("")}</ul>`:""}
          <p class="xs mut">Puan yapay zekânın fotoğraf yorumudur; laboratuvar teşhisi değildir. Kayıt fotoğrafla birlikte günlüğe eklendi.</p>${lg.score!=null&&lg.score<5?`<button class="btn warn full sm" data-go="kurtar">🚑 Acil kurtarma akışına git</button>`:""}</div>`;
      }catch(e){o.innerHTML=`<div class="alert a"><div>${aiErr(e)}</div></div>`}b.disabled=false}})};
function scoreChart(g){const L=(g.logs||[]).filter(l=>l.score!=null).slice(-10);if(L.length<2)return "";

function szList(){const q=lcT(SZQ);$("#szl").innerHTML=GLOSS.filter(g=>!q||lcT(g[0]+" "+g[1]).includes(q)).map(g=>`<div class="card" style="margin:8px 0"><b>${esc(g[0])}</b><p class="sm" style="margin:4px 0 0">${esc(g[1])}</p></div>`).join("")||`<p class="mut">Bulunamadı. <a data-tab="ask">Çiftçi Dostu'na sorun</a>.</p>`}

const GL_SKIP=new Set(["ocak","tava","çanak","kalem","aşı","sürgün","budama","çapa","drenaj","ph","kompost"]);
const GL_IDX=GLOSS.map((g,i)=>[glKey(g[0]),i]).filter(x=>x[0].length>=4&&!GL_SKIP.has(x[0])).sort((a,b)=>b[0].length-a[0].length);
function glossDOM(root){if(!root)return;const used=new Set(),W=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("button,a,input,textarea,select,.gl,svg,h1,h2,h3,b")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(W.nextNode())nodes.push(W.currentNode);
  nodes.forEach(n=>{const low=lcT(n.nodeValue);for(const [k,i] of GL_IDX){if(used.has(i))continue;let at=low.indexOf(k);while(at>=0&&at>0&&/\p{L}/u.test(low[at-1]))at=low.indexOf(k,at+1);if(at<0)continue;used.add(i);
    const mid=n.splitText(at);mid.splitText(k.length);const s=document.createElement("span");s.className="gl";s.dataset.act="gl";s.dataset.arg=i;s.textContent=mid.nodeValue;mid.parentNode.replaceChild(s,mid);break}})}
ACTS.gl=i=>{const g=GLOSS[+i];modal("📖 "+g[0],`<p>${esc(g[1])}</p><button class="btn ghost full" data-x data-go="sozluk">Tüm sözlük</button>`)};

TITLES.evtest="🫙 Evde Toprak Testi";
function texClass(sa,si,cl){
  if(si+1.5*cl<15)return "Kum";if(si+1.5*cl>=15&&si+2*cl<30)return "Tınlı kum";
  if((cl>=7&&cl<20&&sa>52&&si+2*cl>=30)||(cl<7&&si<50&&si+2*cl>=30))return "Kumlu tın";
  if(cl>=7&&cl<27&&si>=28&&si<50&&sa<=52)return "Tın";
  if((si>=50&&cl>=12&&cl<27)||(si>=50&&si<80&&cl<12))return "Siltli tın";if(si>=80&&cl<12)return "Silt";
  if(cl>=20&&cl<35&&si<28&&sa>45)return "Kumlu killi tın";if(cl>=27&&cl<40&&sa>20&&sa<=45)return "Killi tın";if(cl>=27&&cl<40&&sa<=20)return "Siltli killi tın";
  if(cl>=35&&sa>45)return "Kumlu kil";if(cl>=40&&si>=40)return "Siltli kil";return "Kil"}
const TEXNOTE={"Kum":"Suyu ve besini tutmaz; bol kompost, sık ve az sulama.","Tınlı kum":"Hızlı kurur; kompost ve malç şart.","Kumlu tın":"İyi drenaj, kolay işlenir; organik maddeyle mükemmel.","Tın":"Bahçe için en ideal toprak.","Siltli tın":"Verimli; yüzeyde kaymak bağlar, malç serin.","Silt":"Kaymak bağlar, sıkışır; kompost ve malç.","Kumlu killi tın":"Orta; organik madde ekleyin.","Killi tın":"Verimli ama ağır; ıslakken işlemeyin, kompost ekleyin.","Siltli killi tın":"Ağır ve geç ısınır; yükseltilmiş yatak ve kompost.","Kumlu kil":"Ağır; drenaj ve kompost.","Siltli kil":"Çok ağır; su birikir, yükseltilmiş yatak önerilir.","Kil":"Çok ağır, geç ısınır, su birikir; yükseltilmiş yatak, bol kompost, ıslakken bellemeyin."};
VIEWS.evtest=()=>{const E=LS.get("cd_evtest",{});return `<p class="sm mut">Laboratuvara gitmeden, evdeki malzemelerle toprağınızı tanıyın. Kesin değerler için toprak analizi yaptırın (<a data-go="toprakanaliz">sonuçları buraya girin</a>).</p>
 <div class="card"><h3 style="margin-top:0">🫙 1. Kavanoz testi (bünye)</h3><ol class="sm" style="padding-left:18px"><li>Düz kenarlı kavanozun 1/3'ünü 10-15 cm derinlikten alınmış toprakla doldurun (taş ve kökleri ayıklayın).</li><li>Kalanına su, bir çay kaşığı bulaşık deterjanı ekleyip 3-5 dakika kuvvetle çalkalayın.</li><li><b>1 dakika</b> sonra dipteki tabakayı işaretleyin: <b>kum</b>.</li><li><b>2 saat</b> sonra yeni tabakayı işaretleyin: <b>silt</b>.</li><li><b>1-2 gün</b> (su duruluncaya kadar) sonra en üst tabaka: <b>kil</b>.</li><li>Her tabakanın kalınlığını mm olarak cetvelle ölçüp girin.</li></ol>
  <div class="grid3"><div class="fld"><label>Kum (mm)</label><input id="eS" type="number" inputmode="decimal" value="${E.s||""}"></div><div class="fld"><label>Silt (mm)</label><input id="eSi" type="number" inputmode="decimal" value="${E.si||""}"></div><div class="fld"><label>Kil (mm)</label><input id="eC" type="number" inputmode="decimal" value="${E.c||""}"></div></div><div id="eTex"></div></div>
 <div class="card"><h3 style="margin-top:0">🧪 2. Sirke ve karbonat (kaba pH)</h3><ol class="sm" style="padding-left:18px"><li>İki kaba birer kaşık toprak koyun.</li><li>Birincisine yarım bardak <b>sirke</b> dökün: köpürüp fokurdarsa toprak <b>kireçli/bazik</b> (yaklaşık pH 7,5+).</li><li>İkinciyi saf suyla (pet şişe su) çamur yapıp <b>karbonat</b> serpin: köpürürse toprak <b>asidik</b>.</li><li>İkisinde de tepki yoksa büyük ihtimalle <b>nötre yakın</b>.</li></ol>
  <div class="seg">${[["kirecli","Sirkede köpürdü"],["notr","Tepki yok"],["asidik","Karbonatta köpürdü"]].map(([k,t])=>`<button class="${E.ph===k?"on":""}" data-act="eph" data-arg="${k}">${t}</button>`).join("")}</div>
  ${E.ph?`<div class="alert ${E.ph==="notr"?"g":"a"}"><div class="sm">${E.ph==="kirecli"?"Kireçli toprak: Türkiye'de çok yaygın. Yaban mersini, kestane, ahududu gibi asit sever bitkiler zorlanır; demir eksikliği (sararma) görülebilir. Bu bir gösterge testidir.":E.ph==="asidik"?"Asidik toprak: patates, çilek, yaban mersini sever; lahanagiller ve fasulye için kireç gerekebilir. Bu bir gösterge testidir.":"Nötre yakın: çoğu sebze ve meyve için uygun."} <button class="btn sm ghost" data-act="soApply" data-arg="${({kirecli:"kireçli",asidik:"asidik",notr:"nötr"})[E.ph]}">Konumuma kaydet</button></div></div>`:""}</div>
 <div class="card"><h3 style="margin-top:0">💧 3. Süzülme (drenaj) testi</h3><ol class="sm" style="padding-left:18px"><li>30 cm derin, 30 cm genişlikte çukur kazın; suyla doldurun, tamamen süzülmesini bekleyin (toprak doysun).</li><li>Tekrar doldurun ve 1 saat sonra su seviyesinin kaç cm düştüğünü ölçün.</li></ol>
  <div class="fld"><label>1 saatte düşüş (cm)</label><input id="eD" type="number" inputmode="decimal" value="${E.d||""}"></div><div id="eDo"></div></div>
 <div class="card"><h3 style="margin-top:0">🪱 4. Solucan sayımı</h3><p class="sm">Toprak nemli ve ılıkken (ilkbahar/sonbahar) 30×30 cm, bir kürek derinliğinde toprak çıkarıp bir torbanın üstünde dağıtın; solucanları sayıp geri koyun.</p>
  <div class="fld"><label>Solucan sayısı</label><input id="eW" type="number" inputmode="numeric" value="${E.w!=null?E.w:""}"></div><div id="eWo"></div></div>
 <button class="btn full" data-act="esave">💾 Sonuçları kaydet</button>`};
AFTER.evtest=()=>{const v=id=>parseFloat(($("#"+id)||{}).value);
  const tex=()=>{const s=v("eS"),si=v("eSi"),c=v("eC");const t=s+si+c;if(!(t>0)){$("#eTex").innerHTML="";return}const ps=s/t*100,psi=si/t*100,pc=c/t*100,cl=texClass(ps,psi,pc);
    $("#eTex").innerHTML=`<div class="alert g"><div class="sm"><b>Kum %${Math.round(ps)} · Silt %${Math.round(psi)} · Kil %${Math.round(pc)} → ${cl}</b><br>${esc(TEXNOTE[cl])}<br><span class="xs mut">Sınıflandırma: ${SRC.soil}. Kavanoz testi yaklaşık sonuç verir.</span></div></div>`};
  const dr=()=>{const d=v("eD");$("#eDo").innerHTML=isNaN(d)?"":`<div class="alert ${d<1.25?"r":d>15?"a":"g"}"><div class="sm">${d<1.25?"<b>Kötü drenaj.</b> Su birikir, kök çürür: yükseltilmiş yatak, kompost, kum değil organik madde ekleyin.":d>15?"<b>Çok hızlı drenaj.</b> Toprak kurak kalır: kompost ve malç ile su tutmayı artırın.":"<b>İyi drenaj</b> (saatte 2,5-15 cm aralığı idealdir)."}</div></div>`};
  const wm=()=>{const w=v("eW");$("#eWo").innerHTML=isNaN(w)?"":`<div class="alert ${w>=10?"g":w>=5?"a":"r"}"><div class="sm">${w>=10?"<b>Canlı, sağlıklı toprak.</b>":w>=5?"<b>Orta.</b> Kompost ve malçla solucanları besleyin.":"<b>Zayıf biyolojik yaşam.</b> Organik madde ekleyin, toprağı çıplak bırakmayın, gereksiz kimyasal ilaçtan kaçının."} <span class="xs mut">(Kılavuz değer: bir kürek toprakta 10+ solucan iyi kabul edilir.)</span></div></div>`};
  ["eS","eSi","eC"].forEach(i=>$("#"+i).oninput=tex);$("#eD").oninput=dr;$("#eW").oninput=wm;tex();dr();wm()};
ACTS.eph=k=>{const E=LS.get("cd_evtest",{});E.ph=k;LS.set("cd_evtest",E);const y=scrollY;render();scrollTo(0,y)};
ACTS.esave=()=>{const E=LS.get("cd_evtest",{});const v=id=>{const x=parseFloat($("#"+id).value);return isNaN(x)?undefined:x};E.s=v("eS");E.si=v("eSi");E.c=v("eC");E.d=v("eD");E.w=v("eW");E.date=today();
  const t=(E.s||0)+(E.si||0)+(E.c||0);if(t>0)E.tex=texClass(E.s/t*100,E.si/t*100,E.c/t*100);LS.set("cd_evtest",E);toast("Kaydedildi");render()};

TITLES.alisveris="🛒 Alışveriş Listesi";
function shopNeeds(){
  const Y=NOW.getMonth()>=9?NOW.getFullYear()+1:NOW.getFullYear(),PL=udGet("plan",{beds:[]}),need={},area={v:0},rows={v:0,len:0};
  (PL.beds||[]).forEach(B=>{const c=(B.years||{})[Y]||(B.years||{})[NOW.getFullYear()]||{};const cnt={};Object.values(c).forEach(id=>cnt[id]=(cnt[id]||0)+1);
    Object.entries(cnt).forEach(([id,n])=>{const p=P(id);if(!p)return;const [a,b]=spacingCm(p);need[id]=(need[id]||0)+Math.max(1,Math.floor(n*B.cell*B.cell/(a*b)))});area.v+=B.rows*B.cols*B.cell*B.cell/1e4;rows.v+=B.rows;rows.len=Math.max(rows.len,B.cols*B.cell/100)});
  const src=Object.keys(need).length?"plan":"starter";
  if(src==="starter"){const s=LS.get("cd_starter",null);if(s){const A={balkon:2,kucuk:8,orta:25,buyuk:60}[s.f.alan]||8;area.v=A;s.ids.forEach(id=>{const p=P(id),[a,b]=spacingCm(p);need[id]=Math.max(1,Math.floor(A/s.ids.length*1e4/(a*b)))})}}
  return {need,area:area.v,src:Object.keys(need).length?src:null,rows:rows.v,len:rows.len,Y};
}
VIEWS.alisveris=()=>{const N=shopNeeds(),done=LS.get("cd_shopdone",{}),PRC=LS.get("cd_shopprice",{});
  if(!N.src)return `<div class="alert b"><span class="ic">🛒</span><div class="sm">Liste, <a data-go="plan">bahçe planınızdaki</a> hücrelerden veya <a data-go="ilkbahce">İlk Bahçem</a> setinden hesaplanır. Önce birini oluşturun.</div></div>`;
  const items=[];
  Object.entries(N.need).forEach(([id,n])=>{const p=P(id),r=REQ[id]||{},tree=TREES.includes(p.sh),direct=r.direct||["havuc","turp","marul","ispanak","bezelye","fasulye","maydanoz","roka","pancar","misir","dereotu","semizotu","nohut","bakla","borulce","pazi"].includes(id),bulb=["sogan","sarimsak","patates","yerelmasi","tatlipatates"].includes(id);
    const v=bestVars(p,1)[0];const vt=v&&v.s.lv>=2?" · önerilen çeşit: "+v.v.n:"";
    if(tree)items.push([id,"🌳",`${p.n} fidanı (aşılı, sertifikalı)`,n+" adet",vt]);
    else if(bulb)items.push([id,"🧅",`${p.n} ${id==="sogan"?"arpacığı":id==="sarimsak"?"tohumluk diş":id==="tatlipatates"?"fidesi (çelik)":"tohumluk yumru"}`,id==="patates"?`${n} yumru (~${Math.ceil(n*0.06)} kg)`:id==="sogan"?`${n} adet (~${Math.ceil(n*3/1000*10)/10} kg)`:n+" adet",vt]);
    else if(direct)items.push([id,"🌰",`${p.n} tohumu`,`${n} bitki için ocak başı 2-3 tohum → ~${Math.ceil(n*2.5)} tohum`,vt]);
    else items.push([id,"🪴",`${p.n} fidesi`,`${n} adet (+%10 yedek: ${Math.ceil(n*1.1)})`,vt+" · veya kendiniz: ~"+Math.ceil(n*1.5)+" tohum"]);
    if(STAKE.has(id)&&!tree)items.push([id+"_s","🪵",`${p.n} için sırık/kazık`,`${id==="domates"?n:Math.ceil(n/2)} adet (1,8-2,5 m)`,""]);});
  const A=Math.max(1,Math.round(N.area*10)/10);
  items.push(["kompost","♻️","Kompost veya yanmış ahır gübresi",`${Math.round(A*2)}-${Math.round(A*4)} kg (${A} m² × 2-4 kg/m²)`,"Toprağınıza göre Hesaplayıcı'dan ayarlayın"]);
  items.push(["malc","🍂","Malç (saman/yaprak)",`~${Math.round(A*0.07*1000)} litre (${A} m² × 7 cm)`,"Küçük kare saman balyası yaklaşık 150 litre eder"]);
  items.push(["ip","🎗️","Bağlama ipi / rafya, etiket kalemi","1 rulo",""]);
  if(N.rows)items.push(["damla","💧","Damla sulama borusu",`~${Math.ceil(N.rows*N.len*1.1)} m (+ ana hat, filtre, ekler)`,"Sıra başına bir hat"]);
  items.push(["alet","🧰","Temel aletler","Bel küreği, çapa, el küreği, budama makası, eldiven, süzgeçli kova",""]);
  const tot=items.reduce((s,i)=>s+(parseFloat(PRC[i[0]])||0),0);
  return `<div class="alert g"><span class="ic">📋</span><div class="sm">${N.src==="plan"?`Bahçe planınızdaki ${N.Y} hücrelerinden ve bitki aralıklarından hesaplandı.`:"İlk Bahçem setinden ve seçtiğiniz alan büyüklüğünden hesaplandı."} Toplam alan ~${A} m².</div></div>
  <div class="card">${items.map(i=>`<div class="row" style="align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);${done[i[0]]?"opacity:.45":""}"><button data-act="shdone" data-arg="${i[0]}" style="width:28px;height:28px;border-radius:8px;border:2px solid var(--g5);flex:none;background:${done[i[0]]?"var(--g5)":"#fff"};color:#fff">${done[i[0]]?"✓":""}</button><div style="flex:1"><b class="sm">${i[1]} ${esc(i[2])}</b><div class="xs">${esc(i[3])}</div>${i[4]?`<div class="xs mut">${esc(i[4])}</div>`:""}</div><input data-shp="${i[0]}" type="number" inputmode="decimal" placeholder="₺" value="${PRC[i[0]]||""}" style="width:72px;padding:6px;border:1px solid var(--line);border-radius:9px"></div>`).join("")}
  <div class="row" style="margin-top:8px"><b style="flex:1">Toplam (girdiğiniz fiyatlar)</b><b>${tot?tl(tot):"—"}</b></div></div>
  <div class="row" style="gap:6px"><button class="btn" style="flex:1" data-act="shcopy">📋 Listeyi kopyala</button><button class="btn ghost" data-act="shledger">📒 Deftere gider yaz</button></div>
  <p class="xs mut" style="margin-top:6px">Fiyatları kendi fideciniz/marketinizden girin; uygulama uydurma fiyat kullanmaz.</p>`};

/* ---- Sıcak dalgası & don alarmı (bülten verisinden) ---- */
function weatherAlarms(){const D=bulDays(7);const fr=D.filter(x=>x.min<=0),cold=D.filter(x=>x.min>0&&x.min<=3),h38=D.filter(x=>x.max>=38),h35=D.filter(x=>x.max>=35&&x.max<38);const A=[];
  if(fr.length)A.push(["r","❄️",`Don: ${fr.map(x=>fmtD(x.d)+" "+Math.round(x.min)+"°C").join(", ")}`,"Hassas fide ve saksıları akşam örtün (tülbent, battaniye, ters kova); saksıları duvar dibine çekin; akşamüstü toprağı sulayın; örtüyü sabah güneş ısıtınca kaldırın."]);
  else if(cold.length)A.push(["a","🥶",`Soğuk gece: ${cold.map(x=>fmtD(x.d)+" "+Math.round(x.min)+"°C").join(", ")}`,"Çukur ve vadi tabanlarında yer donu olabilir; genç fideleri örtün."]);
  if(h38.length)A.push(["r","🔥",`Sıcak dalgası: ${h38.map(x=>fmtD(x.d)+" "+Math.round(x.max)+"°C").join(", ")}`,"Sabah erken derin sulama, kalın malç, öğlen %30-50 gölge file. Saksıları gölgeye alın. Bu günlerde ilaçlama, gübreleme ve dikim yapmayın; domates-biberde çiçek dökümü olabilir."]);
  else if(h35.length)A.push(["a","🥵",`Çok sıcak: ${h35.map(x=>fmtD(x.d)+" "+Math.round(x.max)+"°C").join(", ")}`,"Sabah sulayın, öğlen ilaçlama ve gübre vermeyin; kükürtlü ilaç kullanmayın."]);
  return A}
function alarmHtml(){return weatherAlarms().map(a=>`<div class="alert ${a[0]}"><span class="ic">${a[1]}</span><div class="sm"><b>${esc(a[2])}</b><br>${esc(a[3])}<div class="xs mut">Kaynak: MGM tahmini (haftalık bülten, ${fmtD(BUL.updated)})</div></div></div>`).join("")}

/* ---------- Yapay zekâ ---------- */
async function b64(blob){const u=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function token(){const {data}=await P.sb.auth.getSession();return data&&data.session?data.session.access_token:""}
const sample=async(input,opts)=>{opts=opts||{};
  const messages=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:String(m.content||"")}));
  const images=[];for(const b of (opts.images||[]))images.push({data:await b64(b),type:b.type||"image/jpeg"});
  const stream=typeof opts.onText==="function";
  const r=await fetch(C.SUPABASE_URL+"/functions/v1/ai",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json",apikey:C.SUPABASE_ANON_KEY,Authorization:"Bearer "+await token()},body:JSON.stringify({app:APP,messages,images,stream,tier:opts.modelTier==="complex"?"complex":"default",kind:curKind()})});
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}const e=new Error(j.message||"Hata");e.code=j.error==="rate_limited"?"rate_limited":j.error||"error";e.text=j.message||"Yapay zekâ yanıt veremedi.";refreshAccess();throw e}
  let text="",trunc=false;
  if(!stream){const j=await r.json();text=j.text||"";trunc=!!j.truncated}
  else{const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;let j;try{j=JSON.parse(line.slice(5))}catch(e){continue}
        if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta"){text+=j.delta.text;try{opts.onText({text,delta:j.delta.text})}catch(e){}}
        else if(j.type==="message_delta"&&j.delta&&j.delta.stop_reason==="max_tokens")trunc=true;
        else if(j.type==="error"){const e=new Error("stream");e.code="rate_limited";e.text="Yapay zekâ yanıtı yarıda kesildi; tekrar deneyin.";throw e}}}}
  setTimeout(refreshAccess,800);return {text,truncated:trunc};
};
sample.limits=async()=>({images:true});
function curKind(){try{return (typeof curView==="function"&&curView().v)||""}catch(e){return ""}}

/* ---------- Veri: user_data + çevrimdışı kuyruk ---------- */
let UID=null,mirror={},outbox=[],started=false;const L={col:[],doc:{}};
const mk=()=>"cd_mirror_"+UID,ok=()=>"cd_outbox_"+UID;
const snapCol=fc=>({docs:Object.keys(mirror).filter(k=>k.startsWith("doc:")).map(k=>({id:k.slice(4),exists:true,data:()=>mirror[k]})),metadata:{fromCache:fc}});
const snapDoc=k=>({id:k,exists:k in mirror,data:()=>mirror[k],metadata:{}});
function emit(fc){L.col.forEach(f=>{try{f(snapCol(fc))}catch(e){console.error(e)}});Object.keys(L.doc).forEach(k=>L.doc[k].forEach(f=>{try{f(snapDoc(k))}catch(e){console.error(e)}}))}
function persist(){sv(mk(),mirror);sv(ok(),outbox)}
async function pull(){const {data,error}=await P.sb.from("user_data").select("key,value").eq("app_id",APP);if(error)throw error;
  const pend=new Set(outbox.map(o=>o.key)),next={};data.forEach(r=>{next[r.key]=r.value});pend.forEach(k=>{if(k in mirror)next[k]=mirror[k];else delete next[k]});mirror=next;persist();emit(false)}
let flushing=false,retryT=null;
async function flush(){if(flushing||!outbox.length)return;flushing=true;
  try{while(outbox.length){const op=outbox[0];
    const q=op.del?P.sb.from("user_data").delete().eq("app_id",APP).eq("key",op.key):P.sb.from("user_data").upsert({user_id:UID,app_id:APP,key:op.key,value:op.value,updated_at:new Date().toISOString()});
    const {error}=await q;
    if(error){if(!navigator.onLine||/fetch|network|Failed/i.test(error.message||"")){clearTimeout(retryT);retryT=setTimeout(flush,15000);break}
      console.error("Kayıt hatası",error);outbox.shift();if(window.toast)toast("Bir kayıt sunucuya yazılamadı.")}
    else outbox.shift();persist()}}finally{flushing=false}}
function write(k,v,del){if(del)delete mirror[k];else mirror[k]=v;outbox=outbox.filter(o=>o.key!==k);outbox.push(del?{key:k,del:true}:{key:k,value:v});persist();emit(true);return flush()}
function startSync(){if(started)return;started=true;
  pull().catch(()=>{});
  try{P.sb.channel("ud-"+UID).on("postgres_changes",{event:"*",schema:"public",table:"user_data",filter:"user_id=eq."+UID},pl=>{
    const r=pl.eventType==="DELETE"?pl.old:pl.new;if(!r||!r.key||(r.app_id&&r.app_id!==APP)||outbox.some(o=>o.key===r.key))return;
    if(pl.eventType==="DELETE")delete mirror[r.key];else mirror[r.key]=r.value;persist();emit(false)}).subscribe()}catch(e){}
  window.addEventListener("online",()=>{flush();pull().catch(()=>{})});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){flush();pull().catch(()=>{});refreshAccess()}});
}
const keyOf=p=>p==="shared/location"?"location":p==="shared/bulletin"?"bulletin":p.replace(/\//g,":");
function docApi(k){return {set:v=>write(k,JSON.parse(JSON.stringify(v))),delete:()=>write(k,null,true),get:async()=>snapDoc(k),
  onSnapshot(cb){(L.doc[k]=L.doc[k]||[]).push(cb);cb(snapDoc(k));startSync();return ()=>{L.doc[k]=L.doc[k].filter(f=>f!==cb)}}}}
const db={collection(){return {onSnapshot(cb){L.col.push(cb);cb(snapCol(true));startSync();return ()=>{L.col=L.col.filter(f=>f!==cb)}},doc:id=>docApi("doc:"+id)}},doc:p=>docApi(keyOf(p))};

/* ---------- Fotoğraflar ---------- */
const assets={async upload(blob){const ext=((blob.type||"image/jpeg").split("/")[1]||"jpg").replace("jpeg","jpg");
  const path=UID+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+"."+ext;
  const {error}=await P.sb.storage.from("photos").upload(path,blob,{contentType:blob.type||"image/jpeg"});if(error)throw error;
  const {data,error:e2}=await P.sb.storage.from("photos").createSignedUrl(path,60*60*24*365*10);if(e2)throw e2;return {url:data.signedUrl,path}}};

/* ---------- Ses ---------- */
function dictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null;const F=[],S=[];
  return {onFinal:f=>F.push(f),onState:f=>S.push(f),
    start:()=>new Promise((res,rej)=>{try{rec=new SR();rec.lang="tr-TR";rec.interimResults=false;rec.continuous=!isIOS;
      rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)F.forEach(f=>f({text:e.results[i][0].transcript}))};
      rec.onstart=()=>{S.forEach(f=>f({state:"listening"}));res()};rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){const x=new Error("mic");x.code="not_granted";rej(x)}};
      rec.onend=()=>S.forEach(f=>f({state:"idle"}));rec.start()}catch(e){rej(e)}}),
    stop:()=>{try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}}
function tts(){if(!window.speechSynthesis)return null;
  return {speak:(t)=>new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";const v=speechSynthesis.getVoices().find(v=>/^tr/i.test(v.lang));if(v)u.voice=v;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}),stop:()=>speechSynthesis.cancel()}}
const downloads={async save({filename,data}){const type=/\.ics$/.test(filename)?"text/calendar":/\.json$/.test(filename)?"application/json":"application/octet-stream";
  const f=new File([data],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:filename});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};

window.claude={use:async n=>({sample,db,assets,downloads,user:{id:async()=>UID},dictation:dictation(),tts:tts()})[n]||null};

/* ---------- Bildirimler ---------- */
const urlB64=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))};
P.push={
  supported:()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window&&!!C.VAPID_PUBLIC_KEY,
  async state(){if(!P.push.supported())return isIOS&&!P.isStandalone()?"install":"unsupported";if(Notification.permission==="denied")return "denied";
    const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription();return s?"on":"off"},
  async enable(){const perm=await Notification.requestPermission();if(perm!=="granted")throw new Error("İzin verilmedi");
    const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(C.VAPID_PUBLIC_KEY)});
    const j=s.toJSON();const {error}=await P.sb.from("push_subs").upsert({endpoint:j.endpoint,user_id:UID,app_id:APP,keys:j.keys});if(error)throw error},
  async disable(){const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription();if(s){await P.sb.from("push_subs").delete().eq("endpoint",s.endpoint);await s.unsubscribe()}},
  test:()=>P.sb.functions.invoke("notify",{body:{type:"test"}}),
};

/* ---------- Açılış ---------- */
let booted=false;
function start(){if(booted)return;booted=true;hideGate();
  P.acc=ld("cd_acc_"+UID,null);mirror=ld(mk(),{});outbox=ld(ok(),[]);
  render();initCaps();refreshAccess();P.sb.rpc("touch").then(()=>{},()=>{});
  const v=new URLSearchParams(location.search).get("v");if(v&&VIEWS[v]){history.replaceState(null,"",location.pathname);if(["guide","cal","ask","garden","home"].includes(v))setTab(v);else go(v)}
}
P.boot=async function(){
  if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||!window.supabase){document.getElementById("main").innerHTML=`<div class="alert r" style="margin:20px"><span class="ic">⚙️</span><div><b>Kurulum tamamlanmamış.</b> config.js dosyasına Supabase adresini ve anahtarını yazın${window.supabase?"":" (veya internet bağlantısını kontrol edin)"}.</div></div>`;return}
  P.sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(reg=>{reg.addEventListener("updatefound",()=>{const n=reg.installing;n&&n.addEventListener("statechange",()=>{if(n.state==="installed"&&navigator.serviceWorker.controller&&window.toast)toast("Yeni sürüm indirildi; uygulamayı kapatıp açınca etkin olur.")})})}).catch(()=>{});
  P.sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="PASSWORD_RECOVERY"){gateMode="newpw";showGate();return}
    if(s&&s.user&&!booted&&gateMode!=="newpw"){UID=s.user.id;P.user=s.user;start()}
    if(ev==="SIGNED_OUT"&&booted)location.reload();
  });
  const {data}=await P.sb.auth.getSession();
  if(data&&data.session&&gateMode!=="newpw"){UID=data.session.user.id;P.user=data.session.user;start()}
  else if(!booted){
    // çevrimdışı ve daha önce giriş yapılmışsa yerel kopyayla aç
    const last=ld("cd_last_uid",null);if(!navigator.onLine&&last){UID=last;start();return}
    showGate()}
};
const _start=start;start=function(){if(UID)sv("cd_last_uid",UID);_start()};
})();

PLATFORM.boot();
